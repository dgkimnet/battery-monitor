services:
  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "${PORT:-3000}:3000"

  prisma-studio:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      BROWSER: none
    command: ["npx", "prisma", "studio", "--port", "5555", "--browser", "none"]
    ports:
      - "${PRISMA_STUDIO_PORT:-5555}:5555"

  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-battery} -d ${POSTGRES_DB:-battery_monitor}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
